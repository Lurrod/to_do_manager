name: Release

# une étiquette `vX.Y.Z` — et rien d'autre — fabrique et publie un installeur.
# Aucune release ne sort d'un poste de développement : ce qui est installé chez
# les gens vient de cette machine-ci, à partir d'un commit étiqueté.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # créer la release et y déposer l'installeur

jobs:
  publier:
    runs-on: windows-latest

    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}\.mongo-binaries

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Cache du binaire Mongo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.mongo-binaries
          # la version fait foi dans lib/mongod-version.js ; la répéter ici ne
          # sert qu'à invalider le cache quand elle change
          key: mongod-${{ runner.os }}-8.2.6

      - run: npm ci

      # une étiquette v2.1.0 sur un package.json resté en 2.0.0 publierait une
      # release que l'auto-update ne proposerait jamais : autant s'arrêter ici
      - name: Vérifier que l'étiquette et la version concordent
        shell: pwsh
        # le nom de l'étiquette passe par l'environnement et non par une
        # interpolation `${{ }}` dans le script : un tag nommé `v1.0";whoami;"`
        # s'exécuterait ici, avec le jeton de publication à portée
        env:
          ETIQUETTE: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $etiquette = $env:ETIQUETTE -replace '^v', ''
          if ($version -ne $etiquette) {
            throw "package.json est en $version mais l'étiquette dit $etiquette"
          }
          Write-Host "Version $version — concordance vérifiée"

      - name: Tests et seuils de couverture
        run: npm test

      # `prerelease` va chercher mongod ; electron-builder publie l'installeur
      # et le latest.yml que lit l'auto-update des postes déjà installés
      - name: Construire et publier
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Le README promet une empreinte a chaque release ; la calculer a la main
      # la rendrait fausse le jour ou on l'oublierait. L'installeur n'etant pas
      # signe, c'est le seul moyen offert a quelqu'un de verifier ce qu'il a
      # telecharge.
      - name: Publier l'empreinte du binaire
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETIQUETTE: ${{ github.ref_name }}
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          if (-not $exe) { throw "Aucun .exe dans dist/ - rien a empreindre." }
          $empreinte = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash
          $octets = '{0:N0}' -f $exe.Length
          $cloture = [string]([char]96) * 3

          $lignes = @(
            ''
            '## Verifier le fichier'
            ''
            $cloture
            "SHA-256  $empreinte"
            "octets   $octets"
            $cloture
            ''
            ($cloture + 'powershell')
            ('Get-FileHash -Algorithm SHA256 "$env:USERPROFILE\Downloads\' + $exe.Name + '"')
            $cloture
            ''
            "Si l'empreinte correspond, le fichier n'a pas ete modifie depuis sa construction par GitHub Actions."
          )

          # on ajoute, on ne remplace pas : des notes redigees a la main restent
          $notes = gh release view $env:ETIQUETTE --json body --jq .body
          Set-Content -Path notes.md -Value ($notes + ($lignes -join [Environment]::NewLine)) -Encoding utf8
          gh release edit $env:ETIQUETTE --notes-file notes.md
          Write-Host "Empreinte publiee : $empreinte"

      - name: Conserver l'installeur
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installeur-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 90
